name: Quality Gate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript Compiler)
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Build Production Distribution
        run: npm run build
